services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: system_guardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://guardian:guardian@postgres:5432/system_guardian
      CHECK_MODE: mock
      CRON_SECRET: dev-secret
    depends_on:
      - postgres

volumes:
  pgdata:
