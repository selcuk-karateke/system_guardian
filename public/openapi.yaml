openapi: 3.1.0
info:
  title: System Guardian API
  version: 0.1.0
  description: |
    HTTP-API für Health, Status (Bots), Cron-Trigger und Historie.

    **Auth-Übersicht**
    - Cron: `Authorization: Bearer <CRON_SECRET>`
    - Status-API: `Authorization: Bearer <API_SECRET>`
    - Health: öffentlich
    - Agent ingest/install/bundle: öffentlich (Ingest mit per-server Agent-Token)
    - History: Dashboard-Session (Cookie), wenn Auth aktiv ist
    - Jobs: Dashboard-Session (Cookie), wenn Auth aktiv ist
  contact:
    name: System Guardian Ops
servers:
  - url: /
    description: Relative zur App (lokal oder Coolify)
tags:
  - name: Health
  - name: Status
  - name: Cron
  - name: History
  - name: Jobs
  - name: Agent
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness / Prozess ok
      description: Kein Auth. Für Load-Balancer und Coolify Healthchecks.
      operationId: getHealth
      responses:
        "200":
          description: Service antwortet
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  service:
                    type: string
                    example: system_guardian
                  checkMode:
                    type: string
                    enum: [mock, ssh]
                    example: mock

  /api/monitor/live:
    get:
      tags: [Monitor]
      summary: Near-realtime Egress/Talker für Statusband
      description: |
        Leichter Poll (~8s) für die Monitor-Wand. Liefert nur den frischen
        Agent-Snapshot (Egress + Top-Talker), ohne Full-Page-Refresh.
        Session-Auth wenn AUTH aktiv (nicht öffentlich wie /api/agent/*).
      operationId: monitorLive
      parameters:
        - name: serverId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Live-Snapshot oder online=false
        "400":
          description: serverId fehlt

  /api/agent/ingest:
    post:
      tags: [Agent]
      summary: Live-Metriken vom Host-Agent
      description: |
        Outbound-Push vom Node-Agent. Auth: `Authorization: Bearer <agent-token>`
        (pro Server, einmalig bei Create/Rotate). Enthält Metriken + Top-Talker.
      operationId: agentIngest
      security:
        - bearerAgent: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentVersion, hostname]
              properties:
                agentVersion:
                  type: string
                hostname:
                  type: string
                serverId:
                  type: string
                  format: uuid
                cpuPercent:
                  type: number
                  nullable: true
                egress:
                  type: object
                  nullable: true
                talkers:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Ingest ok
        "401":
          description: Fehlendes oder falsches Agent-Token
        "400":
          description: Ungültiges Payload

  /api/agent/install.sh:
    get:
      tags: [Agent]
      summary: Install-Skript (shell)
      description: One-Liner-Ziel für Host-Setup. Kein Auth.
      operationId: agentInstallSh
      responses:
        "200":
          description: bash install script
          content:
            text/x-shellscript:
              schema:
                type: string

  /api/agent/bundle.js:
    get:
      tags: [Agent]
      summary: Agent-Script (ESM)
      description: Vom Install-Skript heruntergeladen. Kein Auth.
      operationId: agentBundle
      responses:
        "200":
          description: guardian-agent.mjs Inhalt
          content:
            application/javascript:
              schema:
                type: string

  /api/status:
    get:
      tags: [Status]
      summary: Globaler Status (read-only)
      description: |
        Für Discord-Bot / Integrationen. Benötigt `API_SECRET`.
        Ohne konfiguriertes `API_SECRET` → 503.
      operationId: getStatus
      security:
        - bearerApi: []
      responses:
        "200":
          description: Aktueller Aggregat-Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum: [ok, warning, critical, unknown]
                  lastCheck:
                    type: string
                    format: date-time
                    nullable: true
                  checkMode:
                    type: string
        "401":
          description: Fehlendes oder falsches Bearer-Token
        "503":
          description: API nicht konfiguriert oder DB nicht erreichbar

  /api/cron/server:
    get:
      tags: [Cron]
      summary: Server-Check-Batch starten
      description: |
        Module 1–10 (Host, RAID, Docker, Coolify, DB, SSL, Website, Ports, Backups, Logs).
        Typisch alle **15 Minuten** per Coolify-Cron.
      operationId: cronServer
      security:
        - bearerCron: []
      responses:
        "200":
          description: Batch gelaufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronBatchResult"
        "401":
          description: Unauthorized
        "500":
          description: Check fehlgeschlagen

  /api/cron/security:
    get:
      tags: [Cron]
      summary: Security-Check-Batch starten
      description: |
        FIM, SSH-Keys, Users, Logins, Web Presence, Cron, Processes, Network, Scanner, Services, security_posture, Trivy.
        Typisch alle **60 Minuten**.
      operationId: cronSecurity
      security:
        - bearerCron: []
      responses:
        "200":
          description: Batch gelaufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronBatchResult"
        "401":
          description: Unauthorized
        "500":
          description: Check fehlgeschlagen

  /api/cron/daily-report:
    get:
      tags: [Cron]
      summary: Tagesbericht erzeugen und senden
      description: Typisch täglich 09:00. Nutzt konfigurierte Notify-Kanäle.
      operationId: cronDailyReport
      security:
        - bearerCron: []
      responses:
        "200":
          description: Report-Ergebnis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
        "500":
          description: Report fehlgeschlagen

  /api/jobs:
    get:
      tags: [Jobs]
      summary: Hintergrund-Aufgaben (Checks, Scans, Backup, Redeploy)
      description: |
        Prozess-lokale Job-Liste für das Overlay. Bei aktivem Dashboard-Login:
        Session-Cookie nötig.
      operationId: getJobs
      responses:
        "200":
          description: Aktive und kürzlich beendete Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  active:
                    type: boolean
                  jobs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          description: Unauthorized (wenn Auth aktiv)

  /api/history:
    get:
      tags: [History]
      summary: Timeline / Point-in-time Checks
      description: |
        JSON für die Historie-UI. Bei aktivem Dashboard-Login: Session-Cookie nötig
        (kein `API_SECRET`-Bearer derzeit).
      operationId: getHistory
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start (Default = to − 7 Tage)
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Ende (Default = jetzt)
        - name: module
          in: query
          schema:
            type: string
          description: Optional Filter auf Modul-ID (z. B. docker)
        - name: mode
          in: query
          schema:
            type: string
            enum: [range, point]
            default: range
          description: range = Checks/Changes/Alerts; point = Snapshot zum Zeitpunkt `to`
      responses:
        "200":
          description: Historien-Daten
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Ungültiges from/to
        "401":
          description: Unauthorized (wenn Auth aktiv)

components:
  securitySchemes:
    bearerCron:
      type: http
      scheme: bearer
      description: Wert von `CRON_SECRET`
    bearerApi:
      type: http
      scheme: bearer
      description: Wert von `API_SECRET`
    bearerAgent:
      type: http
      scheme: bearer
      description: Per-Server Metrics-Agent-Token (`sga_…`)
  schemas:
    CronBatchResult:
      type: object
      properties:
        ok:
          type: boolean
        ran:
          type: integer
          description: Anzahl ausgeführter Module
        modules:
          type: array
          items:
            type: object
            properties:
              module:
                type: string
              status:
                type: string
                enum: [ok, warning, critical, unknown]
